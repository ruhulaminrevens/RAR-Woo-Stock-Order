name: Validate plugin

on:
  push:
    branches:
      - main
      - hotfix/v1.2.1
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: node --check assets/js/staff.js

      - name: Shell syntax
        run: bash -n tests/runtime-smoke.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata
        run: |
          VERSION=$(sed -n 's/^ \* Version: \(.*\)$/\1/p' rar-woo-stock-order.php | head -1)
          test "$VERSION" = "1.2.1"
          grep -q '^Stable tag: 1.2.1$' readme.txt
          grep -q '^## 1.2.1 — 2026-09-25$' CHANGELOG.md
          grep -q '^# RAR Woo Stock & Order v1.2.1$' RELEASE_NOTES.md

      - name: Build canonical installable ZIP
        run: |
          VERSION=$(sed -n 's/^ \* Version: \(.*\)$/\1/p' rar-woo-stock-order.php | head -1)
          ROOT=rar-woo-stock-order
          rm -rf dist
          mkdir -p "dist/$ROOT"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='dist' \
            ./ "dist/$ROOT/"
          (cd dist && zip -qr "rar-woo-stock-order-v$VERSION.zip" "$ROOT")
          unzip -t "dist/rar-woo-stock-order-v$VERSION.zip"
          unzip -l "dist/rar-woo-stock-order-v$VERSION.zip" | grep -q "rar-woo-stock-order/rar-woo-stock-order.php"
          unzip -l "dist/rar-woo-stock-order-v$VERSION.zip" | grep -q "rar-woo-stock-order/assets/data/bd-cities.json"
          if unzip -l "dist/rar-woo-stock-order-v$VERSION.zip" | grep -Eq "rar-woo-stock-order/(\.github|tests)/"; then
            echo "Development-only files leaked into release ZIP."
            exit 1
          fi
          (cd dist && sha256sum "rar-woo-stock-order-v$VERSION.zip" > SHA256SUMS.txt)

  runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, intl
          tools: wp-cli

      - name: Run WordPress + WooCommerce runtime smoke tests
        env:
          WP_PATH: /tmp/rar-wso-wp
          BASE_URL: http://127.0.0.1:8080
        run: bash tests/runtime-smoke.sh
